  <g text-rendering="geometricPrecision" transform="scale(1, 1)">
    <rect x="0" y="0" width="960" height="540" fill="#FBE4D4" />
    <g transform="matrix(1, 0, 0, 1, 73.19882, 32.348423)"><text font-family="Calibri" font-style="normal" font-weight="normal" font-stretch="normal" font-size="33pt" fill="#000000" x="0" y="85.07389"><tspan x="0" y="37.553894">Story Mode / Interactive practice (Adding 0-</tspan><tspan x="0" y="85.07389">4)</tspan></text></g>
    <g transform="matrix(1, 0, 0, 1, 73.19882, 147.3484)"><text font-family="Arial" font-style="normal" font-weight="normal" font-stretch="normal" font-size="19.875pt" fill="#FF0000" x="0" y="304.62244"><tspan x="0" y="21.902401">•</tspan><tspan x="18.05" y="21.902401" font-family="Calibri" font-stretch="normal" font-size="19.5pt" font-weight="bold">Story Mode Transition – Abby VO Script</tspan><tspan x="0" y="59.982403" font-family="Calibri" font-stretch="normal" font-size="19.5pt" font-weight="bold">Abby (bright, energetic tone):</tspan><tspan x="0" y="98.06241" font-family="Calibri" font-stretch="normal" font-size="19.5pt" fill="#000000">“Wow, AbaQuesters — you’ve really been working hard! You’ve learned how</tspan><tspan xml:space="preserve" x="804.32715" y="98.06241" font-family="Calibri" font-stretch="normal" font-size="19.5pt"> </tspan><tspan x="0" y="126.14241" font-family="Calibri" font-stretch="normal" font-size="19.5pt" fill="#000000">to add with zero, one, two, three, and even four!</tspan><tspan x="0" y="154.22241" font-family="Calibri" font-stretch="normal" font-size="19.5pt" fill="#000000">But now it’s time to take your new skills into the real world of AbaQuest!</tspan><tspan x="0" y="182.30241" font-family="Calibri" font-stretch="normal" font-size="19.5pt" fill="#000000">Let’s join Ameer and Ameerah at Mistress Creola’s School of Mental Math to</tspan><tspan xml:space="preserve" x="803.9072" y="182.30241" font-family="Calibri" font-stretch="normal" font-size="19.5pt"> </tspan><tspan x="0" y="210.38242" font-family="Calibri" font-stretch="normal" font-size="19.5pt" fill="#000000">see what happens next.</tspan><tspan x="0" y="238.46242" font-family="Calibri" font-stretch="normal" font-size="19.5pt" fill="#000000">Get ready — your Junior Counter powers are about to be put to the test!”</tspan><tspan x="0" y="276.54242" font-family="Calibri" font-stretch="normal" font-size="19.5pt" font-weight="bold">[Sound cue: soft whoosh or sparkle sound → fade into background music</tspan><tspan xml:space="preserve" x="786.51855" y="276.54242" font-family="Calibri" font-stretch="normal" font-size="19.5pt" font-weight="bold"> </tspan><tspan x="0" y="304.62244" font-family="Calibri" font-stretch="normal" font-size="19.5pt" font-weight="bold">for story mode]</tspan></text></g></g>
