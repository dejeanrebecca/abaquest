<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="13.333333in" height="7.5in" class="slides-canvas" viewBox="0 0 960 540">
  <g text-rendering="geometricPrecision" transform="scale(1, 1)">
    <rect x="0" y="0" width="960" height="540" fill="#D5DBE5" />
    <g transform="matrix(1, 0, 0, 1, 73.19882, 32.348423)"><text font-family="Calibri" font-style="normal" font-weight="normal" font-stretch="normal" font-size="33pt" fill="#000000" x="0" y="61.31389"><tspan x="0" y="61.31389">Story Mode –intro (Adding 0-4)</tspan></text></g>
    <g transform="matrix(1, 0, 0, 1, 51.50653, 147.34843)"><text font-family="Calibri" font-style="normal" font-weight="normal" font-stretch="normal" font-size="16.5pt" fill="#000000" x="0" y="304.6544"><tspan x="0" y="14.414399" font-weight="bold">Story Mode Intro – Book 1:</tspan><tspan xml:space="preserve" x="246.40918" y="14.414399" font-weight="bold"> </tspan><tspan x="0" y="42.894398" fill="#FF0000" font-weight="bold">Abby (excited, welcoming tone):</tspan><tspan x="0" y="71.3744">“Welcome, young AbaQuester! I’m so happy you’re here.</tspan><tspan x="0" y="89.85439">Today, you’re joining a very special place —</tspan><tspan xml:space="preserve" x="384.3047" y="89.85439"> </tspan><tspan x="389.3047" y="89.85439" textLength="375.0254" font-weight="bold">Mistress Creola’s School of Mental Math!</tspan><tspan x="0" y="108.33439">It’s a magical school where numbers come alive, and every student learns to use their</tspan><tspan xml:space="preserve" x="762.04297" y="108.33439"> </tspan><tspan x="767.04297" y="108.33439" textLength="55.875" font-weight="bold">Junior</tspan><tspan xml:space="preserve" x="822.91797" y="108.33439" textLength="5" font-weight="bold"> </tspan><tspan x="0" y="126.814384" font-weight="bold">Counter</tspan><tspan x="73.15234" y="126.814384" textLength="368.51074" xml:space="preserve"> to solve puzzles and explore new worlds.</tspan><tspan x="0" y="155.29439">But wait! Some of the students at the school need your help. Their counters are mixed up,</tspan><tspan xml:space="preserve" x="801.9707" y="155.29439"> </tspan><tspan x="0" y="173.77438">their beads are out of place, and they can’t finish their math challenges without you!</tspan><tspan x="0" y="192.25438">That’s where you come in — a brave AbaQuester ready to help your friends, use your math</tspan><tspan xml:space="preserve" x="809.2461" y="192.25438"> </tspan><tspan x="0" y="210.73438">powers, and earn</tspan><tspan xml:space="preserve" x="155.09473" y="210.73438"> </tspan><tspan x="160.09473" y="210.73438" textLength="108.50293" font-weight="bold">Quest Coins</tspan><tspan x="268.59766" y="210.73438" textLength="306.9707" xml:space="preserve"> for every challenge you complete.</tspan><tspan x="0" y="239.21437">So grab your Junior Counter, take a deep breath, and get ready to begin your first quest!</tspan><tspan x="0" y="257.69437">Are you ready to help the School of Mental Math? Let’s go, AbaQuester!”</tspan><tspan x="0" y="286.17438" fill="#FF0000" font-weight="bold">[Sound cue: soft adventure music begins → sparkle or whoosh transition into the classroom</tspan><tspan xml:space="preserve" x="834.4238" y="286.17438" font-weight="bold"> </tspan><tspan x="0" y="304.6544" fill="#FF0000" font-weight="bold">scene]</tspan></text></g></g>
</svg>