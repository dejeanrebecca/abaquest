      <g transform="matrix(1, 0, 0, 1, 73.20078, 83.7296)"><text font-family="Arial" font-style="normal" font-weight="normal" font-stretch="normal" font-size="13.5pt" fill="#000000" x="0" y="17.502798"><tspan x="0" y="17.502798">Best Practice</tspan></text></g>
      <g transform="matrix(1, 0, 0, 1, 487.20078, 83.7296)"><text font-family="Arial" font-style="normal" font-weight="normal" font-stretch="normal" font-size="13.5pt" fill="#000000" x="0" y="17.502798"><tspan x="0" y="17.502798">How We Apply It</tspan></text></g>
      <g transform="matrix(1, 0, 0, 1, 73.20078, 112.53039)"><text font-family="Arial" font-style="normal" font-weight="normal" font-stretch="normal" font-size="13.5pt" fill="#000000" x="0" y="39.1028"><tspan x="0" y="39.1028" font-weight="bold">Repetition with variation</tspan></text></g>
      <g transform="matrix(1, 0, 0, 1, 487.20078, 112.53039)"><text font-family="Arial" font-style="normal" font-weight="normal" font-stretch="normal" font-size="13.5pt" fill="#000000" x="0" y="60.702797"><tspan x="0" y="17.502798">Use same 3 parts but change color, orientation, or</tspan><tspan xml:space="preserve" x="398.00684" y="17.502798"> </tspan><tspan x="0" y="39.1028">context so children must</tspan><tspan xml:space="preserve" x="194" y="39.1028"> </tspan><tspan x="199" y="39.1028" textLength="183" font-style="italic">recognize conceptually</tspan><tspan x="382" y="39.1028" textLength="5">,</tspan><tspan xml:space="preserve" x="387" y="39.1028" textLength="5"> </tspan><tspan x="0" y="60.702797">not memorize the picture.</tspan></text></g>
      <g transform="matrix(1, 0, 0, 1, 73.20078, 184.53117)"><text font-family="Arial" font-style="normal" font-weight="normal" font-stretch="normal" font-size="13.5pt" fill="#000000" x="0" y="28.3028"><tspan x="0" y="28.3028" font-weight="bold">Concrete → representational</tspan></text></g>
      <g transform="matrix(1, 0, 0, 1, 487.20078, 184.53117)"><text font-family="Arial" font-style="normal" font-weight="normal" font-stretch="normal" font-size="13.5pt" fill="#000000" x="0" y="39.1028"><tspan x="0" y="17.502798">Start with real image, end with simple cartoon to</tspan><tspan xml:space="preserve" x="383" y="17.502798"> </tspan><tspan x="0" y="39.1028">check transfer.</tspan></text></g>
      <g transform="matrix(1, 0, 0, 1, 73.20078, 234.93196)"><text font-family="Arial" font-style="normal" font-weight="normal" font-stretch="normal" font-size="13.5pt" fill="#000000" x="0" y="17.502798"><tspan x="0" y="17.502798" font-weight="bold">Limited load</tspan></text></g>
      <g transform="matrix(1, 0, 0, 1, 487.20078, 234.93196)"><text font-family="Arial" font-style="normal" font-weight="normal" font-stretch="normal" font-size="13.5pt" fill="#000000" x="0" y="17.502798"><tspan x="0" y="17.502798">4 questions total (≈ 90 seconds).</tspan></text></g>
      <g transform="matrix(1, 0, 0, 1, 73.20078, 263.73276)"><text font-family="Arial" font-style="normal" font-weight="normal" font-stretch="normal" font-size="13.5pt" fill="#000000" x="0" y="28.3028"><tspan x="0" y="28.3028" font-weight="bold">Positive tone / no grades</tspan></text></g>
      <g transform="matrix(1, 0, 0, 1, 487.20078, 263.73276)"><text font-family="Arial" font-style="normal" font-weight="normal" font-stretch="normal" font-size="13.5pt" fill="#000000" x="0" y="39.1028"><tspan x="0" y="17.502798">Abby gives gentle, encouraging feedback (“Good</tspan><tspan xml:space="preserve" x="390" y="17.502798"> </tspan><tspan x="0" y="39.1028">thinking!”).</tspan></text></g>
      <g transform="matrix(1, 0, 0, 1, 73.20078, 314.13354)"><text font-family="Arial" font-style="normal" font-weight="normal" font-stretch="normal" font-size="13.5pt" fill="#000000" x="0" y="28.3028"><tspan x="0" y="28.3028" font-weight="bold">Multiple response modes</tspan></text></g>
      <g transform="matrix(1, 0, 0, 1, 487.20078, 314.13354)"><text font-family="Arial" font-style="normal" font-weight="normal" font-stretch="normal" font-size="13.5pt" fill="#000000" x="0" y="39.1028"><tspan x="0" y="17.502798">Tap or drag; optional “I don’t know yet” to reduce</tspan><tspan xml:space="preserve" x="386.00488" y="17.502798"> </tspan><tspan x="0" y="39.1028">anxiety.</tspan></text></g>
      <g transform="matrix(1, 0, 0, 1, 73.20078, 364.53433)"><text font-family="Arial" font-style="normal" font-weight="normal" font-stretch="normal" font-size="13.5pt" fill="#000000" x="0" y="28.3028"><tspan x="0" y="28.3028" font-weight="bold">Gamified mastery meter</tspan></text></g>
      <g transform="matrix(1, 0, 0, 1, 487.20078, 364.53433)"><text font-family="Arial" font-style="normal" font-weight="normal" font-stretch="normal" font-size="13.5pt" fill="#000000" x="0" y="39.1028"><tspan x="0" y="17.502798">After each item, a small “bead light” fills up—</tspan><tspan x="0" y="39.1028">visible progress keeps motivation high.</tspan></text></g>
